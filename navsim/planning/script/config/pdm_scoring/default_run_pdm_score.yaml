hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - scorer: pdm_scorer
  - agent: constant_velocity_agent
  - _self_
  - override train_test_split: navtest

max_scenarios_per_task: 64
gpu_inference: false
gpu_device: cuda:0
gpu_num_devices: 1
gpu_batch_size: 4
gpu_num_workers: 0

oracle_gt:
  enabled: false
  cache_path: null
  gt_path: null
  missing_gt: error
  prepare_only: false
  lambdas: null
  lambda_multipliers: [0, 0.03, 0.1, 0.3, 1, 3, 10, 30]
  include_min_ade: true

simulator:
  _target_: navsim.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  _convert_: 'all'
  proposal_sampling: ${proposal_sampling}
