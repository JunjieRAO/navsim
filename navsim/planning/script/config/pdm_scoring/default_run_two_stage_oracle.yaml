hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - scorer: pdm_scorer
  - agent: drivoR
  - _self_
  - override train_test_split: navhard_two_stage

experiment_name: drivor_nav2_two_stage_oracle
gpu_device: cuda:0
gpu_num_devices: 1
gpu_batch_size: 4
gpu_num_workers: 0
oracle_workers: 4
oracle_max_mappings: 0
oracle_ec_mode: none
oracle_sigma_squared: 0.1
oracle_seed: 0

simulator:
  _target_: navsim.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  _convert_: 'all'
  proposal_sampling: ${proposal_sampling}